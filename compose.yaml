# Local infrastructure for development: `docker compose up -d`, stop: `docker compose down`
# (add `-v` to also remove data volumes).
#
# Development: infrastructure in containers, the application on the host (`cargo run`).
# Full stack incl. the containerized application (step 024):
#   docker compose --profile app up -d --build

services:
  # The application image built from ./Dockerfile (step 024).
  # `profiles` – started only with `--profile app`, so `docker compose up` for development
  # doesn't start it (port 3000 stays free for `cargo run`).
  app:
    profiles: ["app"]
    build: .
    image: room-booking-service:latest
    ports:
      - "3000:3000"
    environment:
      # Configuration through environment variables (12-factor). Inside the compose network
      # services are reachable by their names (postgres, keycloak, jaeger).
      APP_ENVIRONMENT: production
      DATABASE_URL: postgres://booking:booking@postgres:5432/booking
      # Secret from the host environment / .env next to compose.yaml; the fallback is for
      # local demos only. Production: Docker/Kubernetes secrets or a secret manager.
      APP_AUTH__JWT_SECRET: ${APP_AUTH__JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      # Tokens say iss=http://localhost:8180/... (KC_HOSTNAME), but from inside the network
      # Keycloak is reachable as keycloak:8080 – fetch discovery/JWKS via the internal name.
      APP_OIDC__DISCOVERY_URL: http://keycloak:8080/realms/room-booking/.well-known/openid-configuration
      APP_TELEMETRY__OTLP_ENDPOINT: http://jaeger:4318
      RUST_LOG: info,rust_services=debug
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      jaeger:
        condition: service_started
    # Must exceed `server.shutdown_grace_period_secs` (25 s in production.toml): Docker sends
    # SIGTERM, waits this long, then SIGKILL.
    stop_grace_period: 30s
    # The image's HEALTHCHECK (`rust-services healthcheck`) is used automatically.
    restart: unless-stopped

  # PostgreSQL – used from step 014. Credentials match DATABASE_URL in .env.example.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<version>/...
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Keycloak – OpenID Connect / OAuth 2.0 identity provider (step 020).
  # Admin console: http://localhost:8180 (admin / admin). The realm `room-booking` with clients,
  # roles and test users is imported from ./keycloak on startup (existing realm is not overwritten).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fixed public URL -> the `iss` claim is always http://localhost:8180/realms/room-booking,
      # no matter which hostname a client used to reach Keycloak.
      KC_HOSTNAME: http://localhost:8180
      # Allow back-channel calls (JWKS, discovery) via the internal hostname `keycloak:8080`.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; use bash's /dev/tcp against the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Jaeger – stores and visualizes traces (step 023). Receives OTLP on 4317 (gRPC) / 4318 (HTTP).
  # UI: http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  # Prometheus – scrapes and stores metrics (step 023). UI: http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Makes host.docker.internal work on Linux as well.
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
