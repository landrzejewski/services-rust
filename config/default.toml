# Default configuration shared by all environments.
# Override per environment in config/<APP_ENVIRONMENT>.toml or with env variables:
#   [server] port  ->  APP_SERVER__PORT=8080

[server]
host = "127.0.0.1"
port = 3000
shutdown_grace_period_secs = 10

[runtime]
# worker_threads = 4   # absent = number of CPU cores

[http]
request_timeout_secs = 30
body_limit_bytes = 65536
# Frontend dev servers allowed to call the API from a browser.
cors_allowed_origins = ["http://localhost:5173"]
slow_request_threshold_ms = 500

[booking]
max_active_bookings_per_user = 3
max_duration_minutes = 480

[database]
# url – secret, comes from DATABASE_URL or APP_DATABASE__URL (see .env.example)
max_connections = 10
min_connections = 1
acquire_timeout_secs = 5
run_migrations = true

[storage]
# RoomRepository implementation: "sqlx" | "sea-orm" (feature orm-sea) | "diesel" (feature orm-diesel)
room_repository = "sqlx"

[auth]
# jwt_secret – secret, from APP_AUTH__JWT_SECRET (see .env.example)
jwt_issuer = "room-booking-service"
jwt_audience = "room-booking-api"
access_token_ttl_minutes = 15

[oidc]
# Tokens issued by Keycloak (compose service `keycloak`) are accepted besides our own (step 020).
enabled = true
issuer = "http://localhost:8180/realms/room-booking"
audience = "room-booking-api"
jwks_min_refresh_secs = 60
