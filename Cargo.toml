[package]
name = "rust-services"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
config = { version = "0.15.27", default-features = false, features = ["toml"] }
diesel = { version = "2", default-features = false, features = ["postgres_backend", "uuid", "chrono"], optional = true }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool"], optional = true }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
sea-orm = { version = "2", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"], optional = true }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors", "timeout", "compression-gzip", "compression-br", "request-id", "catch-panic", "limit", "util", "sensitive-headers"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

# Optional alternative implementations of `RoomRepository` (step 017).
# `dep:` – the optional dependency is enabled only through this feature (no implicit feature
# named after the crate). Build: `cargo run --features orm-sea` / `--features orm-diesel`
# or `--all-features`.
[features]
default = []
orm-sea = ["dep:sea-orm"]
orm-diesel = ["dep:diesel", "dep:diesel-async"]

# Lints configured once for the whole crate (Cargo 1.74+) instead of `#![deny(...)]` attributes in code.
# Levels: "allow" | "warn" | "deny" | "forbid". CI runs clippy with `-D warnings`, so every "warn" fails the build there.
[lints.rust]
# No `unsafe` blocks in application code – memory safety is guaranteed by the compiler.
unsafe_code = "forbid"

[lints.clippy]
# Lint groups need a lower priority so individual lints below can override them.
all = { level = "warn", priority = -1 }
# Leftovers from debugging / unfinished code.
dbg_macro = "warn"
todo = "warn"
# `unwrap()` panics without context; prefer `?` or `expect("why this cannot fail")`.
# Allowed in tests via `clippy.toml`.
unwrap_used = "warn"

# sqlx macros run at compile time (they type-check every query); optimizing them speeds up
# incremental builds noticeably – recommended by the sqlx docs.
[profile.dev.package.sqlx-macros]
opt-level = 3

# Argon2 is deliberately expensive; unoptimized (debug) it is ~10x slower, which makes every
# authenticated request in development slow. Optimize just this dependency.
[profile.dev.package.argon2]
opt-level = 3
